# Refreshes data/downloads.json from its badge, rebuilds, checks and pushes to main. Netlify deploys the push.
# It skips `npm run check:fit`: that check needs a browser, and a count in the thousands cannot change a card's height.
name: Refresh downloads

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-downloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run downloads
      - run: npm run build
      - run: npm run check
      - name: Push the refresh to main
        run: |
          git status --short
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Refresh the download counts"
          git push origin HEAD:main
